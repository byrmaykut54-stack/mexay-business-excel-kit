name: Build MexAy Product
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python generator/build_product.py
      - uses: actions/upload-artifact@v4
        with:
          name: MexAy-Business-Excel-Kit
          path: output/MexAy_Business_Excel_Kit.zip
