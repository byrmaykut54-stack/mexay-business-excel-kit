name: Build MexAy Product
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python generator/build_product.py
      - uses: actions/upload-artifact@v6
        with:
          name: MexAy-Business-Excel-Kit
          path: output/MexAy_Business_Excel_Kit.zip
